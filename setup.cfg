[metadata]
name = mempost
version = 0.1.0
author = Ali Siahkoohi
author_email = alisk@ucf.edu
description = Posterior under memorized diffusion priors
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
install_requires =
    matplotlib
    numpy
    tqdm
    torch
    projorg
    h5py
    scipy
packages = find:
python_requires = >=3.9

[options.packages.find]
exclude =
    tests*
    scripts*
    data*
    plots*
